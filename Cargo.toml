[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/transport",
    "apps/agent",
    "apps/client",
    "apps/server",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anchras/remotekvm"

[workspace.dependencies]
# Shared deps pinned centrally so every crate uses the same version.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "signal"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.11"
bytes = "1"

# Server-specific shared deps
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"

# Workspace-internal crates
remotekvm-protocol = { path = "crates/protocol" }
remotekvm-transport = { path = "crates/transport" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
