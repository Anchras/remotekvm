[package]
name = "remotekvm-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remotekvm-client"
path = "src/main.rs"

[dependencies]
remotekvm-protocol = { workspace = true }
remotekvm-transport = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
webrtc = { workspace = true }
bytes = { workspace = true }
rtp = "0.11"
cpal = "0.15"
libloading = "0.8"

# Windowing & Rendering
winit = "0.29"
wgpu = "0.20"
egui = "0.28"
egui-wgpu = "0.28"
egui-winit = "0.28"

# Networking
reqwest = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"

# Async runtime integration
pollster = "0.3"

# Secure token storage (macOS Keychain / Windows Credential Manager / libsecret)
keyring = "2"

# Open the system browser for the OAuth/AuthKit login flow
open = "5"

# Image decoding (for app icons if needed)
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFDictionary",
    "CFNumber",
] }
objc2-core-media = { version = "0.3", features = [
    "CMBase",
    "CMTime",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
] }
objc2-core-video = { version = "0.3", features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-video-toolbox = { version = "0.3", features = [
    "VTDecompressionSession",
    "VTErrors",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[dev-dependencies]
axum = { workspace = true }
