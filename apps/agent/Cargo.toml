[package]
name = "remotekvm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remotekvm-agent"
path = "src/main.rs"

[features]
# Opt-in legacy macOS capture/encode pipeline (ScreenCaptureKit + VideoToolbox).
# Not yet adapted to the SaaS session; enable with `--features macos_v0`.
macos_v0 = []

[dependencies]
remotekvm-protocol = { workspace = true }
remotekvm-transport = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
webrtc = { workspace = true }
bytes = { workspace = true }
tokio-tungstenite = "0.24"
url = "2"
urlencoding = "2"
futures = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSArray"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFDictionary",
    "CFString",
    "CFNumber",
] }
objc2-core-media = { version = "0.3", features = [
    "CMBase",
    "CMTime",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
] }
objc2-core-video = { version = "0.3", features = [
    "CVBase",
    "CVImageBuffer",
    "CVPixelBuffer",
] }
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "SCShareableContent",
] }
objc2-video-toolbox = { version = "0.3", features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTSession",
    "VTErrors",
] }
block2 = "0.6"
dispatch2 = "0.3"
core-graphics = { version = "0.24", features = ["highsierra"] }
