app = "remotekvm-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_BASE_URL = "https://remotekvm-server.fly.dev"
  RUST_LOG = "info,remotekvm_server=info,tower_http=info"
  SIGNALING_TTL_SECONDS = "90"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
